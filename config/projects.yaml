# Configuration for the OSS longitudinal study.
# Each project lists owner/repo plus public-knowledge metadata that informs
# the analysis (primary language, governance model, expected AI-era stance).
#
# To add or remove a project, edit this file and re-run `python src/run.py`.

projects:
  - id: vscode
    owner: microsoft
    repo: vscode
    primary_language: TypeScript
    governance: corporate
    notes: "Microsoft-owned; deep Copilot integration since 2021-Q4"

  - id: react
    owner: facebook
    repo: react
    primary_language: JavaScript
    governance: corporate-OSS
    notes: "Meta-led, mature framework, slow innovation cadence"

  - id: kubernetes
    owner: kubernetes
    repo: kubernetes
    primary_language: Go
    governance: foundation
    notes: "CNCF, complex multi-vendor governance, high contributor count"

  - id: django
    owner: django
    repo: django
    primary_language: Python
    governance: foundation
    notes: "DSF, mature stable framework, conservative review culture"

  - id: numpy
    owner: numpy
    repo: numpy
    primary_language: Python
    governance: community
    notes: "NumFOCUS, scientific computing, deliberate cadence"

  - id: rust
    owner: rust-lang
    repo: rust
    primary_language: Rust
    governance: foundation
    notes: "Rust Foundation, strong engineering culture, AI-friendly tooling"

# Time windows for the longitudinal analysis.
# Quarterly cadence from 2019-Q1 through 2024-Q4 (24 quarters).
study_window:
  start: "2019-01-01"
  end:   "2024-12-31"
  cadence: quarterly

# Era partitioning, mapped to documented AI-tooling milestones:
#   - Copilot Technical Preview: 2021-06
#   - Copilot GA + ChatGPT release: 2022-11
#   - GPT-4: 2023-03 (post-ChatGPT mainstream adoption)
eras:
  pre_ai:
    label: "Pre-AI (baseline)"
    quarters: ["2019Q1","2019Q2","2019Q3","2019Q4","2020Q1","2020Q2","2020Q3","2020Q4"]
  transition:
    label: "Transition (Copilot beta → ChatGPT)"
    quarters: ["2021Q1","2021Q2","2021Q3","2021Q4","2022Q1","2022Q2","2022Q3"]
  ai_era:
    label: "AI-era (post-ChatGPT)"
    quarters: ["2022Q4","2023Q1","2023Q2","2023Q3","2023Q4","2024Q1","2024Q2","2024Q3","2024Q4"]
